<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'"><title>PagePilot · 设置</title><style>
:root{font-family:'Microsoft YaHei UI',sans-serif;color:#1e293b;background:#f5f7fb;font-size:14px}*{box-sizing:border-box}body{margin:0;padding:30px 34px}header{margin-bottom:24px}small{color:#2563eb;font-weight:600;letter-spacing:2px}h1{font-size:27px;margin:8px 0}p{color:#64748b;line-height:1.7;margin:8px 0}section{background:white;border:1px solid #e2e8f0;border-radius:13px;padding:21px 24px;margin:16px 0}h2{font-size:16px;margin:0 0 12px}label{display:flex;align-items:center;gap:10px;cursor:pointer}input{accent-color:#2563eb;width:18px;height:18px}textarea{width:100%;height:116px;resize:vertical;border:1px solid #cbd5e1;border-radius:7px;padding:10px;font:13px Consolas,monospace;line-height:1.7}textarea:focus{outline:2px solid #93c5fd;border-color:#2563eb}button{font:inherit;border-radius:8px;border:1px solid #d8e0ed;background:white;color:#334155;padding:10px 18px;cursor:pointer}button:hover{background:#eff6ff}button.primary{background:#2563eb;color:white;border-color:#2563eb}footer{display:flex;align-items:center;gap:18px;padding:8px 0 20px}#status{color:#64748b;flex:1}section p{font-size:12px}button:disabled{opacity:.5;cursor:wait}
</style></head><body><header><small>PAGEPILOT</small><h1>让 Word 更合你的习惯</h1><p>AI 操作、模型连接与文档结构规则。</p></header>
<section><h2>操作批准</h2><label><input id="automatic" type="checkbox">自动批准本次 Word 会话中的 AI 文档操作</label><p>关闭时逐次询问；重启 Word 后恢复手动批准。批量修改前会保存文档备份。</p></section>
<section><h2>模型与 API</h2><p>使用 Chatbox 原有的模型供应商设置，管理 API Key、模型与服务地址。</p><button id="provider">打开模型设置 ↗</button></section>
<section><h2>自定义标题规则</h2><p>每行一条“级别|正则”，级别为 1–9。自定义规则优先于内置规则；留空使用内置识别。</p><textarea id="rules" aria-label="自定义标题规则" placeholder="1|^第一部分&#10;2|^（[一二三四五六七八九十]+）"></textarea><p>保存后，自动导航侧栏会刷新结构，文档外观保持不变。</p></section>
<footer><span id="status" role="status">正在读取设置…</span><button class="primary" id="save" disabled>保存设置</button></footer><script src="settings.js"></script></body></html>
